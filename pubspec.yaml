name: tramp
description: Tramp — multi-platform desktop music player.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  file_picker: ^8.1.2
  desktop_drop: ^0.5.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  path: ^1.9.0
  smtc_windows: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
