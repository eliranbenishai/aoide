name: tramp
description: Tramp — multi-platform desktop music player.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Fork pin required by desktop_multi_window (plugin README).
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4
  # Path override below: per-role 75% secondary seeds (not 1280×720).
  desktop_multi_window: 0.3.0
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  file_picker: ^8.1.2
  desktop_drop: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0
  archive: ^4.0.2
  smtc_windows: ^1.0.0
  flutter_svg: ^2.3.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  flutter_rust_bridge: 2.11.1
  desktop_multi_window:
    path: third_party/desktop_multi_window

flutter:
  uses-material-design: true
  assets:
    - lib/ui/chrome/logo.svg
    - assets/proximamagnifica.svg
    - assets/branding/app_icon.png
  fonts:
    - family: TrampCondensed
      fonts:
        - asset: assets/fonts/TrampCondensed-Bold.ttf
          weight: 700
    - family: TrampMono
      fonts:
        - asset: assets/fonts/TrampMono-Medium.ttf
          weight: 500

