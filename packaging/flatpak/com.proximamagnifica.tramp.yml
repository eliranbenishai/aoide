# Binary Flatpak of the staged Qt Linux bundle. Flathub listing is a human PR;
# this is the sandbox/permissions contract and a local test bundle.
app-id: com.proximamagnifica.tramp
runtime: org.kde.Platform
# Must equal QT_RUNTIME from QT_VERSION (major.minor). The pin is the same
# official kit CI and local builds use.
runtime-version: "6.10"
sdk: org.kde.Sdk
command: tramp
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.kde.KWin
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
modules:
  - name: tramp
    buildsystem: simple
    build-commands:
      - install -d /app/tramp /app/bin
      - cp -a . /app/tramp/
      - chmod +x /app/tramp/tramp
      - |
        printf '%s\n' '#!/bin/sh' \
          'export LD_LIBRARY_PATH=/app/tramp/lib:${LD_LIBRARY_PATH:-}' \
          'exec /app/tramp/tramp "$@"' > /app/bin/tramp
      - chmod +x /app/bin/tramp
      - |
        if [ -d share/applications ]; then
          install -d /app/share/applications
          cp -a share/applications/. /app/share/applications/
          sed -i 's|^Exec=.*|Exec=tramp %F|' /app/share/applications/com.proximamagnifica.tramp.desktop || true
        fi
        if [ -d share/icons ]; then
          install -d /app/share/icons
          cp -a share/icons/. /app/share/icons/
        fi
    sources:
      # Staged by packaging/linux/make_flatpak.sh with stage_bundle.sh --no-qt,
      # so this tree carries libmpv and the app but no Qt — the runtime above is
      # the Qt. Deliberately not build/linux/bundle: that is the tarball and
      # AppImage staging and it has a full Qt in it.
      - type: dir
        path: ../../build/linux/flatpak-bundle
