name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default now that merging lives in merge-if-green.yml; the one job
# that comments on a pull request asks for that scope itself.
permissions:
  contents: read

jobs:
  test:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A step that never returns holds the job until the six-hour default, and
    # `CI passed` waits on it. A start that wedges is exactly the failure this
    # lane is most likely to find first, so both the job and the smoke below
    # carry a clock. The job clock is sized for configure, build, stage and
    # smoke — not for a notarization queue.
    timeout-minutes: 60
    strategy:
      # The line is indivisible in `CI passed`, which refuses a partial
      # outcome. Cancelling siblings on the first red cell would hide whether
      # the other two platforms were also broken, which makes one break more
      # expensive to fix, not less.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Qt pin
        shell: bash
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"

      - name: Build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config appstream \
            libgl1-mesa-dev libx11-dev libmpv-dev libmpv2 patchelf \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: AppStream metainfo (Linux)
        if: runner.os == 'Linux'
        run: bash tool/check-metainfo.sh

      - name: Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          # Base archives, not modules: 6.11 has no qtwayland module (the
          # addon is qtwaylandcompositor). qtwayland is the client QPA plugin;
          # icu is what official Linux Qt links against.
          archives: qtbase qtwayland icu

      - name: Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          archives: qtbase
          # Qt moved the Windows repository layout at 6.11: 6.10.3 was one
          # nested qt6_6103/qt6_6103, and 6.11 splits into per-architecture
          # directories (qt6_6111/qt6_6111_msvc2022_64). No released aqtinstall
          # knows the new shape -- PyPI is still on 3.3.0, which the action
          # defaults to, and it fails "Failed to locate XML data for Qt version
          # 6.11.1" before downloading anything. The fix is merged but unreleased,
          # so this pins that commit. Windows only: Linux and macOS are unaffected
          # by the layout change and stay on the released version. Drop this for
          # plain aqtversion once a release past 3.3.0 carries the fix.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

      # fetch_qt.sh exits 1 on Darwin. Same action and pin as the Windows job;
      # host/arch request the official mac desktop kit (clang_64 is the
      # universal Qt 6.5+ layout).
      - name: Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          # macdeployqt lives in qttools. windeployqt is in qtbase, which is why
          # the Windows lane can slice to qtbase alone.
          archives: qtbase qttools

      # stage_linux_libmpv.sh copies the distro full libmpv (and its non-libc
      # NEEDED libs) into third_party so cmake --install ships them.
      # fetch_full_libmpv.sh on Linux only prints where to put a .so; it does
      # not populate the tree.
      - name: Fetch full libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x tool/*.sh packaging/linux/*.sh
          ./tool/stage_linux_libmpv.sh

      - name: Fetch full libmpv (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tool/fetch_full_libmpv.ps1
        shell: pwsh

      - name: Fetch full libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x tool/*.sh packaging/macos/*.sh
          ./tool/fetch_full_libmpv.sh

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
        shell: bash

      # Every platform, not just one compiler. The optimisation guard inside
      # --bench-chrome is compiler-specific, so a budget step that skips a
      # platform leaves that compiler unproven here and discovers it during a
      # release instead.
      - name: Paint budget (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./build/aoide --bench-chrome
        shell: bash

      - name: Paint budget (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-config generators put the binary under the config directory;
          # Ninja and Makefiles put it straight in the build tree.
          exe=build/Release/aoide.exe
          [ -f "$exe" ] || exe=build/aoide.exe
          QT_QPA_PLATFORM=offscreen "$exe" --bench-chrome

      # Bundle target, not a loose binary: OUTPUT_NAME Aoide + MACOSX_BUNDLE
      # makes Aoide.app. Multi-config generators nest it under the config
      # directory; Ninja and Makefiles put it in the build tree root.
      - name: Paint budget (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          exe=build/Aoide.app/Contents/MacOS/Aoide
          [ -f "$exe" ] || exe=build/Release/Aoide.app/Contents/MacOS/Aoide
          QT_QPA_PLATFORM=offscreen "$exe" --bench-chrome

      - name: Stage (Linux)
        if: runner.os == 'Linux'
        run: ./packaging/linux/stage_bundle.sh

      - name: Stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/stage.ps1

      - name: Stage (macOS)
        if: runner.os == 'macOS'
        env:
          AOIDE_BUILD_DIR: ${{ github.workspace }}/build
        run: ./packaging/macos/stage_app.sh

      # Run the staged tree. ctest above ran the build tree, which still
      # resolves Qt and libmpv from the runner; only this run proves the stage
      # carries its own.
      - name: Smoke-test the staged bundle (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Take the runner's Qt out of the environment first. install-qt-action
          # exports LD_LIBRARY_PATH, and with it set a stage missing its own
          # Qt still starts — the check would pass for the wrong reason.
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH
          export QT_QPA_PLATFORM=offscreen
          build/linux/bundle/aoide --bench-chrome
          XDG_DATA_HOME="$(mktemp -d)" AOIDE_AUTO_QUIT=1 build/linux/bundle/aoide

      # Run what we staged. ctest above ran the build tree; this is the only
      # step that proves the staged tree has its Qt DLLs, its libmpv and its
      # assets. The support dir is not redirected here — XDG_DATA_HOME only
      # binds on Linux — but the runner is thrown away.
      - name: Smoke-test the staged EXE (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Plugins are not found through PATH, so stripping Qt's bin below does
          # nothing for them: install-qt-action exports QT_PLUGIN_PATH, and with it
          # set the staged tree loads the runner's platform plugins and a stage
          # carrying none of its own still starts. Same reason the Linux job does
          # this — see stage.ps1 for what makes the stage self-sufficient.
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH
          # Windows searches the exe's own directory first but PATH after it, and
          # install-qt-action puts Qt's bin on PATH. Drop that entry, or a stage
          # windeployqt left a DLL out of would still start.
          if [ -n "${QT_ROOT_DIR:-}" ]; then
            qt_bin="$(cygpath -u "$QT_ROOT_DIR")/bin"
            PATH="$(printf '%s\n' "$PATH" | tr ':' '\n' | grep -vxF "$qt_bin" | paste -sd ':' -)"
            export PATH
          fi
          QT_QPA_PLATFORM=offscreen build/windows/stage/aoide.exe --bench-chrome
          AOIDE_AUTO_QUIT=1 build/windows/stage/aoide.exe

      # Run the staged bundle. ctest above ran the build tree, which still
      # resolves Qt and libmpv from the runner; only this run proves the stage
      # carries its own. The support dir is not redirected here —
      # XDG_DATA_HOME only binds on Linux; macOS uses
      # ~/Library/Application Support — but the runner is thrown away.
      - name: Smoke-test the staged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Take the runner's Qt out of the environment first. install-qt-action
          # exports QT_PLUGIN_PATH, DYLD_FRAMEWORK_PATH and DYLD_LIBRARY_PATH,
          # and with those set a stage missing its own Qt still starts — the
          # check would pass for the wrong reason.
          unset QT_PLUGIN_PATH DYLD_FRAMEWORK_PATH DYLD_LIBRARY_PATH
          export QT_QPA_PLATFORM=offscreen
          build/macos/stage/Aoide.app/Contents/MacOS/Aoide --bench-chrome
          AOIDE_AUTO_QUIT=1 build/macos/stage/Aoide.app/Contents/MacOS/Aoide

  passed:
    name: CI passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Review the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          if [ "${{ needs.test.result }}" = "success" ]; then
            gh pr review "$NUMBER" --repo "$REPO" --comment \
              --body "CI passed on Ubuntu, Windows and macOS. This PR can squash-merge."
          else
            gh pr comment "$NUMBER" --repo "$REPO" \
              --body "CI failed. This PR will not merge until every Qt job is green."
          fi
      - name: Require every Qt job
        if: needs.test.result != 'success'
        run: exit 1

# Merging lives in merge-if-green.yml, not here. A `merge` job in this file runs
# from the pull request's own copy of it, so a PR could edit its way past the
# do-not-merge label; merge-if-green.yml runs from the default branch on
# workflow_run and cannot be rewritten by the branch it is deciding about.
