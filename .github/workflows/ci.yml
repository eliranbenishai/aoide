name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Qt pin
        shell: bash
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"

      - name: Build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgl1-mesa-dev libx11-dev libmpv-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          # Base archives, not modules: 6.10 has no qtwayland module (the
          # addon is qtwaylandcompositor). qtwayland is the client QPA plugin;
          # icu is what official Linux Qt links against.
          archives: qtbase qtwayland icu

      - name: Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          archives: qtbase

      - name: Fetch full libmpv (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tool/fetch_full_libmpv.ps1
        shell: pwsh

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
        shell: bash

      # Both runners, not just Linux. The optimisation guard inside --bench-chrome
      # is compiler-specific, so a Linux-only budget step leaves the Windows half
      # of it unproven here and discovers it during a release instead.
      - name: Paint budget (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./build/tramp --bench-chrome
        shell: bash

      - name: Paint budget (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-config generators put the binary under the config directory;
          # Ninja and Makefiles put it straight in the build tree.
          exe=build/Release/tramp.exe
          [ -f "$exe" ] || exe=build/tramp.exe
          QT_QPA_PLATFORM=offscreen "$exe" --bench-chrome

  passed:
    name: CI passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Review the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          if [ "${{ needs.test.result }}" = "success" ]; then
            gh pr review "$NUMBER" --repo "$REPO" --comment \
              --body "CI passed on Ubuntu and Windows. This PR can squash-merge."
          else
            gh pr comment "$NUMBER" --repo "$REPO" \
              --body "CI failed on Ubuntu and/or Windows. This PR will not merge until the Qt jobs are green."
          fi
      - name: Require every Qt job
        if: needs.test.result != 'success'
        run: exit 1

  merge:
    name: Squash-merge if green
    needs: passed
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.passed.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge unless do-not-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          BLOCKED="$(gh api "repos/$REPO/issues/$NUMBER/labels" --jq '[.[].name] | index("do-not-merge")')"
          if [ "$BLOCKED" != "null" ]; then
            echo "do-not-merge is set; leaving PR open"
            exit 0
          fi
          gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch
