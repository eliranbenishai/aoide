name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default now that merging lives in merge-if-green.yml; the one job
# that comments on a pull request asks for that scope itself.
permissions:
  contents: read

jobs:
  test:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Qt pin
        shell: bash
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"

      - name: Build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config appstream \
            libgl1-mesa-dev libx11-dev libmpv-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: AppStream metainfo (Linux)
        if: runner.os == 'Linux'
        run: bash tool/check-metainfo.sh

      - name: Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          # Base archives, not modules: 6.10 has no qtwayland module (the
          # addon is qtwaylandcompositor). qtwayland is the client QPA plugin;
          # icu is what official Linux Qt links against.
          archives: qtbase qtwayland icu

      - name: Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          archives: qtbase

      - name: Fetch full libmpv (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tool/fetch_full_libmpv.ps1
        shell: pwsh

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
        shell: bash

      # Both runners, not just Linux. The optimisation guard inside --bench-chrome
      # is compiler-specific, so a Linux-only budget step leaves the Windows half
      # of it unproven here and discovers it during a release instead.
      - name: Paint budget (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./build/aoide --bench-chrome
        shell: bash

      - name: Paint budget (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-config generators put the binary under the config directory;
          # Ninja and Makefiles put it straight in the build tree.
          exe=build/Release/aoide.exe
          [ -f "$exe" ] || exe=build/aoide.exe
          QT_QPA_PLATFORM=offscreen "$exe" --bench-chrome

  # Separate job, not a third matrix leg: a packaging job would repeat the
  # universal (x86_64;arm64) build, and a DMG produced in the same job as the
  # tests cannot be uploaded for a commit whose tests failed. The job itself
  # is required — a compile or ctest failure is a regression. Only the
  # packaging steps are continue-on-error, so Apple's notary or a packaging
  # hiccup cannot block a merge.
  macos:
    name: Qt (macos-latest)
    runs-on: macos-latest
    # continue-on-error does not rescue a hang: a step that never returns holds
    # the job until the six-hour default, and `CI passed` waits on it. A start
    # that wedges is exactly the failure this lane is most likely to find first,
    # so both the job and the run below carry a clock.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Qt pin
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"
      # fetch_qt.sh exits 1 on Darwin. Same action and pin as the Windows job;
      # host/arch request the official mac desktop kit (clang_64 is the
      # universal Qt 6.5+ layout).
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          # macdeployqt lives in qttools. windeployqt is in qtbase, which is why
          # the Windows lane can slice to qtbase alone.
          archives: qtbase qttools
      - name: Fetch full libmpv
        run: |
          chmod +x tool/*.sh packaging/macos/*.sh
          ./tool/fetch_full_libmpv.sh
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
      # Bundle target, not a loose binary: OUTPUT_NAME Aoide + MACOSX_BUNDLE
      # makes Aoide.app. Multi-config generators nest it under the config
      # directory; Ninja and Makefiles put it in the build tree root.
      - name: Paint budget
        run: |
          set -euo pipefail
          exe=build/Aoide.app/Contents/MacOS/Aoide
          [ -f "$exe" ] || exe=build/Release/Aoide.app/Contents/MacOS/Aoide
          QT_QPA_PLATFORM=offscreen "$exe" --bench-chrome
      - name: Stage
        continue-on-error: true
        env:
          AOIDE_BUILD_DIR: ${{ github.workspace }}/build
        run: ./packaging/macos/stage_app.sh
      # Run the staged bundle before it is signed. ctest above ran the build
      # tree, which still resolves Qt and libmpv from the runner; only this
      # run proves the stage carries its own. The support dir is not redirected
      # here — XDG_DATA_HOME only binds on Linux; macOS uses
      # ~/Library/Application Support — but the runner is thrown away.
      # notarize.sh then clears extended attributes with xattr -cr before
      # signing, so this run cannot spoil the signature.
      - name: Smoke-test the staged app
        id: smoke
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Take the runner's Qt out of the environment first. install-qt-action
          # exports QT_PLUGIN_PATH, DYLD_FRAMEWORK_PATH and DYLD_LIBRARY_PATH,
          # and with those set a stage missing its own Qt still starts — the
          # check would pass for the wrong reason.
          unset QT_PLUGIN_PATH DYLD_FRAMEWORK_PATH DYLD_LIBRARY_PATH
          export QT_QPA_PLATFORM=offscreen
          build/macos/stage/Aoide.app/Contents/MacOS/Aoide --bench-chrome
          AOIDE_AUTO_QUIT=1 build/macos/stage/Aoide.app/Contents/MacOS/Aoide
      # Gated on the smoke rather than merely following it: a continue-on-error
      # step does not stop the ones after it, so without this the lane would
      # hand over a DMG whose bundle had just failed to start — the one thing a
      # downloadable test build must not be.
      - name: Sign, notarize, wrap DMG
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          AOIDE_MAC_APP: ${{ github.workspace }}/build/macos/stage/Aoide.app
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          eval "$(./tool/version.sh)"
          export AOIDE_MAC_DMG="${GITHUB_WORKSPACE}/build/macos/Aoide-${version}-macos-universal.dmg"
          # notarize.sh no-ops (exit 0) when the certificate secrets are unset
          # and does not write a DMG. When they are set it signs the app, then
          # calls make_dmg.sh itself so the sealed bundle is what gets wrapped.
          # Calling make_dmg.sh unconditionally as well would rebuild the image.
          ./packaging/macos/notarize.sh "$AOIDE_MAC_DMG"
          if [[ ! -f "$AOIDE_MAC_DMG" ]]; then
            ./packaging/macos/make_dmg.sh
          fi
      - uses: actions/upload-artifact@v6
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        with:
          name: macos-dmg
          if-no-files-found: error
          path: build/macos/Aoide-*-macos-universal.dmg

  passed:
    name: CI passed
    needs: [test, macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Review the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.macos.result }}" = "success" ]; then
            gh pr review "$NUMBER" --repo "$REPO" --comment \
              --body "CI passed on Ubuntu, Windows and macOS. This PR can squash-merge."
          else
            gh pr comment "$NUMBER" --repo "$REPO" \
              --body "CI failed on Ubuntu, Windows and/or macOS. This PR will not merge until the Qt jobs are green."
          fi
      - name: Require every Qt job
        if: needs.test.result != 'success' || needs.macos.result != 'success'
        run: exit 1

# Merging lives in merge-if-green.yml, not here. A `merge` job in this file runs
# from the pull request's own copy of it, so a PR could edit its way past the
# do-not-merge label; merge-if-green.yml runs from the default branch on
# workflow_run and cannot be rewritten by the branch it is deciding about.
