name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Override with repo variable MSIX_PUBLISHER after Partner Center identity exists.
  MSIX_PUBLISHER_DEFAULT: "CN=Proxima Magnifica"
  MSIX_IDENTITY_DEFAULT: "ProximaMagnifica.trampmusic"

  # The Qt pin lives in QT_VERSION (x.y.z). export-qt-pin.sh writes QT_VERSION
  # and QT_RUNTIME (x.y) into GITHUB_ENV. That is the same line as
  # org.kde.Platform and as local ./tool/fetch_qt.sh.

jobs:
  test:
    name: Test (Linux Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Qt pin
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgl1-mesa-dev libx11-dev libmpv-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          archives: qtbase qtwayland icu
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x tool/version.sh
          eval "$(./tool/version.sh)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
      - name: Configure and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
      - name: Paint budget
        run: QT_QPA_PLATFORM=offscreen ./build/tramp --bench-chrome

  windows:
    name: Windows EXE + MSIX
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Qt pin
        shell: bash
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          archives: qtbase
      - name: Fetch full libmpv
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool/fetch_full_libmpv.ps1
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
        shell: bash
      - name: Stage
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/stage.ps1
      # Run what we are about to wrap in an installer. ctest above ran the build
      # tree; this is the only step that proves the staged tree has its Qt DLLs,
      # its libmpv and its assets. The support dir is not redirected here —
      # XDG_DATA_HOME only binds on Linux — but the runner is thrown away.
      - name: Smoke-test the staged EXE
        shell: bash
        run: |
          set -euo pipefail
          # Windows searches the exe's own directory first but PATH after it, and
          # install-qt-action puts Qt's bin on PATH. Drop that entry, or a stage
          # windeployqt left a DLL out of would still start.
          if [ -n "${QT_ROOT_DIR:-}" ]; then
            qt_bin="$(cygpath -u "$QT_ROOT_DIR")/bin"
            PATH="$(printf '%s\n' "$PATH" | tr ':' '\n' | grep -vxF "$qt_bin" | paste -sd ':' -)"
            export PATH
          fi
          QT_QPA_PLATFORM=offscreen build/windows/stage/tramp.exe --bench-chrome
          TRAMP_AUTO_QUIT=1 build/windows/stage/tramp.exe
      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          powershell -ExecutionPolicy Bypass -File tool/fetch_vc_redist.ps1
          $ver = (Get-Content VERSION -First 1).Trim()
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *","${env:ProgramFiles}\Inno Setup *" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc.FullName "/DMyAppVersion=$ver" packaging\windows\tramp.iss
      - name: MSIX (unsigned, Store re-signs)
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
        run: |
          $ver = (Get-Content VERSION -First 1).Trim()
          $parts = $ver.Split('.'); while ($parts.Count -lt 3) { $parts += '0' }
          $msix = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $pub = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { $env:MSIX_PUBLISHER_DEFAULT }
          $id = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { $env:MSIX_IDENTITY_DEFAULT }
          & packaging\windows\make_msix.ps1 -Version $msix -Publisher $pub -IdentityName $id
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            build/windows/installer/*.exe
            build/windows/msix/*.msix

  linux:
    name: Linux AppImage + tarball
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Qt pin
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgl1-mesa-dev libx11-dev libmpv-dev libmpv2 patchelf \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          archives: qtbase qtwayland icu
      - name: Stage full libmpv into the tree
        run: |
          chmod +x tool/*.sh packaging/linux/*.sh
          ./tool/stage_linux_libmpv.sh
      - name: Configure, build, stage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          QT_QPA_PLATFORM=offscreen ./build/tramp --bench-chrome
          ./packaging/linux/stage_bundle.sh
      - name: AppImage + tarball
        run: |
          ./packaging/linux/make_appimage.sh
          eval "$(./tool/version.sh)"
          tar -C build/linux -czf \
            "build/linux/Tramp-${version}-linux-x86_64.tar.gz" bundle
      # Run the things we are about to publish. ctest above ran the build tree,
      # which still resolves Qt and libmpv from the runner; only these runs prove
      # the artifacts carry their own. The tarball is extracted somewhere else
      # first, because relocating is the whole claim.
      - name: Smoke-test the artifacts
        run: |
          set -euo pipefail
          # Take the runner's Qt out of the environment first. install-qt-action
          # exports LD_LIBRARY_PATH, and with it set an artifact missing its own
          # Qt still starts — the check would pass for the wrong reason.
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH
          export QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1
          appimage="$(ls build/linux/Tramp-*-linux-x86_64.AppImage)"
          tarball="$(ls build/linux/Tramp-*-linux-x86_64.tar.gz)"

          build/linux/bundle/tramp --bench-chrome
          XDG_DATA_HOME="$(mktemp -d)" TRAMP_AUTO_QUIT=1 build/linux/bundle/tramp

          "$appimage" --bench-chrome
          XDG_DATA_HOME="$(mktemp -d)" TRAMP_AUTO_QUIT=1 "$appimage"

          extracted="$(mktemp -d)"
          tar -C "$extracted" -xzf "$tarball"
          "$extracted/bundle/tramp" --bench-chrome
          XDG_DATA_HOME="$(mktemp -d)" TRAMP_AUTO_QUIT=1 "$extracted/bundle/tramp"
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            build/linux/Tramp-*-linux-x86_64.AppImage
            build/linux/Tramp-*-linux-x86_64.tar.gz

  flatpak:
    name: Linux Flatpak bundle
    needs: test
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Qt pin
        run: bash tool/export-qt-pin.sh >> "$GITHUB_ENV"
      # Built here rather than unpacked from the linux job's tarball. That
      # tarball carries Qt, because a tarball has to; this runs on
      # org.kde.Platform, which is a Qt runtime, and taking the tarball is what
      # used to put a second Qt inside the sandbox. Same staging script as the
      # tarball and the AppImage, with --no-qt — see make_flatpak.sh.
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgl1-mesa-dev libx11-dev libmpv-dev libmpv2 patchelf
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          archives: qtbase qtwayland icu
      - name: Configure and build
        run: |
          chmod +x tool/*.sh packaging/linux/*.sh
          ./tool/stage_linux_libmpv.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # elfutils is only a Recommends of the Ubuntu package. Without it,
          # flatpak-builder dies after the module install: "eu-strip" not found.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            "org.kde.Platform//${QT_RUNTIME}" "org.kde.Sdk//${QT_RUNTIME}"
      - name: Build .flatpak
        run: ./packaging/linux/make_flatpak.sh
      # A second Qt inside a Qt runtime is invisible in a bundle that otherwise
      # works, so assert it rather than trusting the flag stayed wired up.
      - name: Flatpak staging carries no Qt
        run: |
          set -euo pipefail
          stage=build/linux/flatpak-bundle
          if find "$stage" -name 'libQt6*' | grep .; then
            echo "^ Qt in the Flatpak staging: stage_bundle.sh --no-qt regressed" >&2
            exit 1
          fi
          test ! -e "$stage/plugins"
          test ! -e "$stage/qt.conf"
          find "$stage/lib" -name 'libmpv.so*' | grep .
      - name: Smoke-test the .flatpak
        run: |
          set -euo pipefail
          sudo flatpak install -y --noninteractive \
            "$(ls build/linux/Tramp-*-linux-x86_64.flatpak)"
          # System install is fine; `sudo flatpak run` is not. Newer flatpak
          # refuses that form so the sandbox does not inherit sudo's env.
          flatpak run --env=QT_QPA_PLATFORM=offscreen \
            com.proximamagnifica.tramp --bench-chrome
          flatpak run --env=QT_QPA_PLATFORM=offscreen --env=TRAMP_AUTO_QUIT=1 \
            com.proximamagnifica.tramp
      - uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: build/linux/Tramp-*-linux-x86_64.flatpak

  github-release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.msix' -o -name '*.AppImage' \
            -o -name '*.tar.gz' -o -name '*.flatpak' -o -name '*.dmg' \) \
            -exec cp -v {} upload/ \;
          ls -la upload
      - uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          generate_release_notes: true
          draft: false
          body: |
            Source: this tag. Product downloads: https://tramp.music

            Windows Store and Flathub listings are submitted separately from these bits.
            macOS DMG waits on the Qt Mac host.
