name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Override with repo variable MSIX_PUBLISHER after Partner Center identity exists.
  MSIX_PUBLISHER_DEFAULT: "CN=Proxima Magnifica"
  MSIX_IDENTITY_DEFAULT: "ProximaMagnifica.trampmusic"

jobs:
  test:
    name: Test (Linux Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Qt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-wayland libgl1-mesa-dev libx11-dev \
            libmpv-dev
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x tool/version.sh
          eval "$(./tool/version.sh)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
      - name: Configure and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

  windows:
    name: Windows EXE + MSIX
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          archives: qtbase
      - name: Fetch full libmpv
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool/fetch_full_libmpv.ps1
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
        shell: bash
      - name: Stage
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/stage.ps1
      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          powershell -ExecutionPolicy Bypass -File tool/fetch_vc_redist.ps1
          $ver = (Get-Content VERSION -First 1).Trim()
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *","${env:ProgramFiles}\Inno Setup *" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc.FullName "/DMyAppVersion=$ver" packaging\windows\tramp.iss
      - name: MSIX (unsigned, Store re-signs)
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
        run: |
          $ver = (Get-Content VERSION -First 1).Trim()
          $parts = $ver.Split('.'); while ($parts.Count -lt 3) { $parts += '0' }
          $msix = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $pub = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { $env:MSIX_PUBLISHER_DEFAULT }
          $id = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { $env:MSIX_IDENTITY_DEFAULT }
          & packaging\windows\make_msix.ps1 -Version $msix -Publisher $pub -IdentityName $id
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            build/windows/installer/*.exe
            build/windows/msix/*.msix

  linux:
    name: Linux AppImage + tarball
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-wayland libgl1-mesa-dev libx11-dev \
            libmpv-dev libmpv2
      - name: Stage full libmpv into the tree
        run: |
          chmod +x tool/*.sh packaging/linux/*.sh
          ./tool/stage_linux_libmpv.sh
      - name: Configure, build, stage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          ./packaging/linux/stage_bundle.sh
      - name: AppImage + tarball
        run: |
          ./packaging/linux/make_appimage.sh
          eval "$(./tool/version.sh)"
          tar -C build/linux -czf \
            "build/linux/Tramp-${version}-linux-x86_64.tar.gz" bundle
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            build/linux/Tramp-*-linux-x86_64.AppImage
            build/linux/Tramp-*-linux-x86_64.tar.gz

  flatpak:
    name: Linux Flatpak bundle
    needs: linux
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: artifacts
      - name: Unpack Linux bundle
        run: |
          tarball="$(find artifacts -name 'Tramp-*-linux-x86_64.tar.gz' | head -n 1)"
          test -n "$tarball"
          mkdir -p build/linux
          tar -C build/linux -xzf "$tarball"
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.8 org.kde.Sdk//6.8
      - name: Build .flatpak
        run: |
          chmod +x packaging/linux/make_flatpak.sh tool/version.sh
          ./packaging/linux/make_flatpak.sh
      - uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: build/linux/Tramp-*-linux-x86_64.flatpak

  github-release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.msix' -o -name '*.AppImage' \
            -o -name '*.tar.gz' -o -name '*.flatpak' -o -name '*.dmg' \) \
            -exec cp -v {} upload/ \;
          ls -la upload
      - uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          generate_release_notes: true
          draft: false
          body: |
            Source: this tag. Product downloads: https://tramp.music

            Windows Store and Flathub listings are submitted separately from these bits.
            macOS DMG waits on the Qt Mac host.
